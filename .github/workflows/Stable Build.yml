name: build Stable
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: true
        default: 'MIUI-OOS'
        type: choice
        options:
          - MIUI-OOS
          - AOSP

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 🔄 Checkout Code
      uses: actions/checkout@v5
      
    - name: ⏰ Prepare timezone
      run: |
        sudo rm /etc/localtime
        sudo ln -s /usr/share/zoneinfo/Asia/Jakarta /etc/localtime
        
    - name: 📦 Install Dependencies
      run: |
        sudo apt update -y
        sudo apt install bc cpio flex bison aptitude git python-is-python3 tar aria2 perl wget curl lz4 libssl-dev -y
        
    - name: 🔧 Clone Toolchains
      run: |
        mkdir clang && cd clang && curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman" && chmod a+x antman && ./antman -S && ./antman --patch=glibc && cd ..
        git clone https://github.com/greenforce-project/gcc-arm64 -b main --depth=1 gcc64
        git clone https://github.com/greenforce-project/gcc-arm -b main --depth=1 gcc32
        
    - name: ⚙️ Setup Environment
      run: |
        echo "BUILD_TIME=$(TZ=Asia/Jakarta date '+%d%m%Y-%H%M')" >> $GITHUB_ENV
        echo "CLANG_PATH=$GITHUB_WORKSPACE/clang" >> $GITHUB_ENV
        echo "GCC64_PATH=$GITHUB_WORKSPACE/gcc64" >> $GITHUB_ENV
        echo "GCC32_PATH=$GITHUB_WORKSPACE/gcc32" >> $GITHUB_ENV

    - name: 📅 Set BUILD DATE
      run: |
        echo "BUILD_DATE='\"$(TZ=Asia/Jakarta date '+%b %d %Y')\"'" >> $GITHUB_ENV
        
    - name: 📥 Clone KernelSU Drivers
      run: curl -LSs "https://raw.githubusercontent.com/Mr-Morat/KernelSU-Next/stable/kernel/setup.sh" | bash -s syscall

    # --- NEW STEP: PATCH PANEL DIMENSIONS ---
    - name: 📱 Patch Panel Dimensions
      run: |
        apply_panel_dimensions() {
            local w=$1 h=$2
            local files=(
                "arch/arm64/boot/dts/qcom/xiaomi/sweet/dsi-panel-k6-38-0e-0b-fhd-dsc-video.dtsi"
                "arch/arm64/boot/dts/qcom/xiaomi/sweet/dsi-panel-k6-38-0c-0a-fhd-dsc-video.dtsi"
            )
            echo "Setting panel size → ${w} × ${h} mm"
            for f in "${files[@]}"; do
                if [ -f "$f" ]; then
                    sed -i "s/\(qcom,mdss-pan-physical-width-dimension[[:space:]]*=[[:space:]]*< *\)[0-9]\+/\1${w}/" "$f"
                    sed -i "s/\(qcom,mdss-pan-physical-height-dimension[[:space:]]*=[[:space:]]*< *\)[0-9]\+/\1${h}/" "$f"
                    echo "Patched $f"
                else
                    echo "Warning: $f not found!"
                fi
            done
        }

        if [[ "${{ github.event.inputs.build_type }}" == "AOSP" ]]; then
            apply_panel_dimensions 70 155
        else
            # Default to MIUI-OOS dimensions
            apply_panel_dimensions 695 1546
        fi
    # ---------------------------------------
      
    - name: 🛠️ Build Kernel
      run: |
        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"
        export KBUILD_BUILD_USER=MiDoNaSR
        export KBUILD_BUILD_HOST=MiDoNaSR
        export KBUILD_COMPILER_STRING="$CLANG_PATH/clang"
        export BUILD_DATE=$BUILD_DATE
        export CFLAGS_EXTRA="-DBUILD_DATE=$BUILD_DATE"
        make O=out ARCH=arm64 sweet_defconfig
        make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang \
          CLANG_TRIPLE=$CLANG_PATH/aarch64-linux-gnu- \
          CROSS_COMPILE=$GCC64_PATH/bin/aarch64-elf- \
          CROSS_COMPILE_ARM32=$GCC32_PATH/bin/arm-eabi-
        mv out/.config out/sweet_defconfig.txt
        
    - name: 💾 Upload configs
      uses: actions/upload-artifact@v5
      with:
        name: configs-${{ env.BUILD_TIME }}
        path: out/sweet_defconfig.txt
        
    - name: 📂 Clone Anykernel3 & Zip
      run: |
        git clone --depth=1 https://github.com/MiDoNaSR545/AnyKernel3 AnyKernel3
        cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
        cp out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img
        cp out/arch/arm64/boot/dtb.img AnyKernel3/dtb.img
        cd AnyKernel3
        zip -r "../StriXotic-MeMeDo-${{ github.ref_name }}-${{ env.BUILD_TIME }}.zip" *
        
    - name: 📤 Upload Flashable zip
      uses: actions/upload-artifact@v5
      with:
        name: StriXotic-MeMeDo-${{ github.ref_name }}-${{ env.BUILD_TIME }}
        path: AnyKernel3/*
